<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 순위표</title><style>
:root{color-scheme:dark;--line:#343958;--muted:#a7acc7;--lime:#b9ff4a;--blue:#718cff}*{box-sizing:border-box}body{margin:0;background:#10111b;color:#f5f6ff;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:22px 12px 50px}h1{font-size:clamp(28px,6vw,48px);margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}a{color:var(--lime);text-decoration:none}.panel{background:#191b2b;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:15px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:center;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--lime);background:#252844}td:nth-child(2){text-align:left;font-weight:850}.num{font-weight:950;color:var(--lime)}.muted{color:var(--muted);font-size:12px}
</style></head><body><main><div class="top"><div><div style="color:var(--lime);font-size:11px;letter-spacing:.2em">LEAGUE TABLE</div><h1>리그 순위</h1><p class="muted">경기 결과 기반 자동 산출 · 승 3점 / 무 1점</p></div><a href="./index.html">← 메인</a></div><section class="panel table"><table><thead><tr><th>순위</th><th>구단</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득점</th><th>실점</th><th>득실차</th><th>승점</th></tr></thead><tbody id="rows"><tr><td colspan="10">불러오는 중…</td></tr></tbody></table></section></main><script>
async function load(){const r=await fetch('/api/standings');const j=await r.json();if(!r.ok)throw Error(j.error||'순위표 조회 실패');const b=document.getElementById('rows');b.replaceChildren();j.standings.forEach((s,i)=>{const tr=document.createElement('tr');[i+1,s.name,s.played,s.won,s.drawn,s.lost,s.gf,s.ga,s.gd,s.points].forEach((v,k)=>{const td=document.createElement('td');td.textContent=v;if(k===0||k===9)td.className='num';tr.append(td)});b.append(tr)})}load().catch(e=>document.getElementById('rows').textContent=e.message);
</script></body></html>
