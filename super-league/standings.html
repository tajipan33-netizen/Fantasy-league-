<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LEAGUE | 리그 순위</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2c;--line:#26334a;--muted:#94a3b8;--accent:#8cffc7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15263d 0,#080d18 55%);color:#f8fafc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1180px;margin:auto;padding:30px 14px 56px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:800}header{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:12px 0 22px}h1{font-size:clamp(32px,6vw,56px);line-height:1;margin:8px 0;letter-spacing:-.05em}p{color:var(--muted);margin:0}.status{border:1px solid #365246;background:#11251f;border-radius:12px;padding:10px 13px;color:var(--accent);font-weight:800;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}a{display:inline-block;padding:11px 14px;border-radius:10px;background:#1a263a;border:1px solid var(--line);color:#f8fafc;text-decoration:none;font-weight:750;font-size:14px}a.primary{background:var(--accent);color:#07120e;border-color:var(--accent)}.note{margin:0 0 16px;padding:13px 15px;border:1px solid var(--line);background:#0e1727;border-radius:12px;color:#b8c4d6;font-size:13px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:15px;background:rgba(14,22,37,.92)}table{width:100%;border-collapse:collapse;min-width:760px;font-size:14px}th,td{padding:14px 12px;text-align:center;border-bottom:1px solid #202d42;white-space:nowrap}th{font-size:11px;letter-spacing:.06em;color:#a7b4c8;background:#121d30}tbody tr:last-child td{border-bottom:0}td.team{text-align:left;font-weight:750;white-space:normal;min-width:190px}td.rank{color:var(--accent);font-weight:900;width:56px}td.points{font-weight:900;color:var(--accent)}.zero{color:#dbe4f0;font-variant-numeric:tabular-nums}.foot{text-align:center;color:#718096;font-size:12px;margin-top:22px}
@media(max-width:600px){main{padding:24px 10px 40px}th,td{padding:12px 10px}.note{line-height:1.6}}
</style>
</head>
<body><main>
<div class="eyebrow">OFFICIAL FANTASY FOOTBALL PLATFORM</div>
<header><div><h1>LEAGUE TABLE</h1><p>SUPER LEAGUE · 공식 리그 순위</p></div><div class="status">시즌 시작 전 · 0경기</div></header>
<div class="actions"><a href="./index.html">← 팀 목록</a><a class="primary" href="./players.html">팀별 선수 등록 →</a></div>
<div class="note">아직 시즌이 시작되지 않았습니다. 모든 팀의 기록은 0으로 표시되며, 순위는 현재 참가팀 명단 순서입니다.</div>
<div class="table-wrap"><table aria-label="SUPER LEAGUE 리그 순위"><thead><tr><th>순위</th><th style="text-align:left">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득점</th><th>실점</th><th>득실차</th><th>승점</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="foot">SUPER LEAGUE · LEAGUE TABLE v1.0</div>
</main>
<script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","영국 어느시의 푸른 도시(진)","진석축구단","코모쿠젠","해머스","헌럽 FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","본덜랜드","Chelsea","Atletico Milan","아스날FC"];
const tbody=document.getElementById("rows");
teams.forEach((team,index)=>{const tr=document.createElement("tr");const values=[String(index+1),team,"0","0","0","0","0","0","0","0"];values.forEach((value,i)=>{const td=document.createElement("td");td.textContent=value;if(i===0)td.className="rank";if(i===1)td.className="team";if(i===9)td.className="points";if(i>=2&&i!==9)td.classList.add("zero");tr.appendChild(td)});tbody.appendChild(tr)});
</script></body></html>
