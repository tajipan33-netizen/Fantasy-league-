<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 팀 프로필</title><style>
:root{color-scheme:dark;--line:#38332a;--muted:#94a3b8;--accent:#e5c16b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 14% 0%,rgba(229,193,107,.10) 0%,transparent 38%),radial-gradient(ellipse at 88% 12%,rgba(255,255,255,.035) 0%,transparent 34%),linear-gradient(180deg,#111111 0%,#080808 52%,#030303 100%);background-attachment:fixed;color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px 14px 50px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:800}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:clamp(30px,7vw,52px);margin:10px 0}p,.muted,small{color:var(--muted);line-height:1.6}a,button{display:inline-block;border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#07120e;text-decoration:none;font-weight:800;cursor:pointer}.secondary{background:#1c2940;color:#e2e8f0;border:1px solid #334155}.panel,.card{border:1px solid var(--line);border-radius:15px;background:#151515;padding:16px;margin-top:14px}input,select{width:100%;background:#090909;border:1px solid var(--line);border-radius:10px;padding:12px;color:white}.field{display:flex;flex-direction:column;gap:7px;min-width:200px;flex:1;margin:9px 0}label{font-size:13px;color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}.card{margin:0;cursor:pointer;display:flex;align-items:center;gap:12px}.crest{width:66px;height:66px;object-fit:contain;background:#080d18;border-radius:10px;padding:5px}.kit{width:100%;max-height:260px;object-fit:contain;margin-top:12px;background:#080d18;border-radius:10px}.hidden{display:none!important}.preview{width:100%;height:150px;object-fit:contain;background:#080d18;border-radius:10px}.small{font-size:12px}.status{color:var(--accent);min-height:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:520px){main{padding:18px 10px}}
</style></head><body><main><div class="eyebrow">SUPER LEAGUE · CLUB HOUSE</div><header><div><h1>팀 프로필 센터</h1><p>엠블럼 · 유니폼 · 브랜드 · 스폰서</p></div><div class="actions"><a class="secondary" href="./index.html">메인</a><a class="secondary" href="./players.html">선수단</a><a class="secondary" href="./news.html">뉴스</a></div></header>
<section class="panel"><div class="row"><div class="field"><label for="search">팀 검색</label><input id="search" placeholder="팀 이름 검색"></div><div class="field"><label for="team">프로필 등록/수정할 팀</label><select id="team"></select></div></div><p id="status" class="small">프로필 불러오는 중…</p></section><section id="grid" class="grid"></section>
<section class="panel"><h2>내 팀 프로필 등록</h2><p class="small">팀을 선택하고 해당 팀 코드를 입력하세요. 이미지는 자동으로 압축해 공용 저장소에 업로드합니다.</p><div class="row"><div class="field"><label for="code">팀 코드</label><input id="code" type="password" placeholder="팀 코드 입력"></div><button id="unlock">편집 열기</button></div><form id="form" class="hidden"><div class="row"><div class="field"><label for="logo">팀 엠블럼 사진</label><input id="logo" type="file" accept="image/*"><img id="logoPreview" class="preview hidden" alt="엠블럼 미리보기"><button type="button" id="removeLogo" class="secondary">엠블럼 제거</button></div><div class="field"><label for="kit">유니폼 사진</label><input id="kit" type="file" accept="image/*"><img id="kitPreview" class="preview hidden" alt="유니폼 미리보기"><button type="button" id="removeKit" class="secondary">유니폼 제거</button></div></div><div class="panel"><h3>홈 구장 정보</h3><div class="field"><label for="stadiumName">홈 구장 이름</label><input id="stadiumName" maxlength="120" placeholder="예: Celtic Park"></div><div class="field"><label for="stadiumDescription">홈 구장 설명</label><textarea id="stadiumDescription" maxlength="1800" rows="5" placeholder="구장의 역사, 수용 인원, 분위기, 특징 등을 소개해 주세요." style="width:100%;background:#090909;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;resize:vertical"></textarea></div><div class="field"><label for="stadiumPhoto">홈 구장 사진</label><input id="stadiumPhoto" type="file" accept="image/*"><img id="stadiumPhotoPreview" class="preview hidden" alt="홈 구장 사진 미리보기"><button type="button" id="removeStadiumPhoto" class="secondary">구장 사진 제거</button></div></div><div class="row"><div class="field"><label for="brand">유니폼 브랜드</label><input id="brand" maxlength="80" placeholder="예: Nike"></div><div class="field"><label for="mainSponsor">메인 스폰서</label><input id="mainSponsor" maxlength="100" placeholder="예: dafabet"></div><div class="field"><label for="sleeveSponsor">소매 스폰서</label><input id="sleeveSponsor" maxlength="100" placeholder="예: FTMA"></div></div><div class="actions"><button id="save" type="submit">프로필 저장</button><button id="lock" type="button" class="secondary">편집 잠금</button></div></form><p id="message" class="status"></p></section>
</main><script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","ASK로마사라이","진석축구단","코모쿠젠","해머스","헌라페FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","본덜랜드","Chelsea","Atletico Milan","아스날FC"];
const codes=["CEL1887","BAR26X","NOT417","INTN26","VIL926","FEN1907","BLUE711","JIN204","COM026","HAM1895","HUN628","XMC894","SKY619","RYM1902","MSG527","BLEU314","KLS2026","DEL189","CHEL905","ATM732","ARS1886"];
const table="/api/store?collection=team-profiles";const $=id=>document.getElementById(id);let rows=[],active=-1,logoUrl="",kitUrl="",stadiumPhotoUrl="",logoFile=null,kitFile=null,stadiumPhotoFile=null,allowed=false;
teams.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1).toString().padStart(2,"0")+" · "+n;$("team").append(o)});
async function getRows(){const r=await fetch(table+"?select=*&order=team_index.asc",{cache:"no-store"});const raw=await r.text();let data=[];try{data=raw?JSON.parse(raw):[]}catch{}if(!r.ok){if(r.status===401){location.href="/admin-login.html";throw Error("관리자 로그인이 필요합니다.")}throw Error((data&&data.error)||"프로필 불러오기 실패")}rows=data;render()}
function render(){const q=$("search").value.toLowerCase().trim(),g=$("grid");g.innerHTML="";teams.forEach((n,i)=>{if(!n.toLowerCase().includes(q))return;const p=rows.find(x=>Number(x.team_index)===i)||{};const card=document.createElement("article");card.className="card";const img=document.createElement("img");img.className="crest";img.alt=n+" 엠블럼";if(p.logo_url)img.src=p.logo_url;else img.src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23111a2c'/%3E%3Ctext x='40' y='47' text-anchor='middle' font-size='24' fill='%238cffc7'%3E"+(i+1)+"%3C/text%3E%3C/svg%3E";const d=document.createElement("div");const b=document.createElement("b");b.textContent=n;const m=document.createElement("p");m.className="small";m.textContent=[p.kit_brand,p.main_sponsor&&"메인: "+p.main_sponsor,p.sleeve_sponsor&&"소매: "+p.sleeve_sponsor].filter(Boolean).join(" · ")||"프로필 미등록";d.append(b,m);card.append(img,d);card.onclick=()=>{$("team").value=i;$("message").textContent=n+" 선택됨. 팀 코드를 입력해 편집할 수 있습니다.";};g.append(card);if(p.kit_url){const kit=document.createElement("img");kit.className="kit";kit.src=p.kit_url;kit.alt=n+" 유니폼";g.append(kit)}if(p.stadium_name||p.stadium_description||p.stadium_photo_url){const info=document.createElement("div");info.className="panel";const h=document.createElement("h3");h.textContent=p.stadium_name||"홈 구장";info.append(h);if(p.stadium_description){const desc=document.createElement("p");desc.style.whiteSpace="pre-wrap";desc.textContent=p.stadium_description;info.append(desc)}if(p.stadium_photo_url){const photo=document.createElement("img");photo.className="kit";photo.src=p.stadium_photo_url;photo.alt=n+" 홈 구장 사진";info.append(photo)}g.append(info)}});$("status").textContent="21개 팀 · "+rows.length+"개 프로필 등록됨"}
async function compress(file){if(!file.type.startsWith("image/"))throw Error("이미지 파일을 선택해 주세요.");if(file.size>12*1024*1024)throw Error("원본 이미지는 12MB 이하로 선택해 주세요.");const b=await createImageBitmap(file),s=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.width*s));c.height=Math.max(1,Math.round(b.height*s));c.getContext("2d").drawImage(b,0,0,c.width,c.height);b.close();return await new Promise(resolve=>c.toBlob(resolve,"image/jpeg",.8))}
async function upload(file,type){if(!file)return type==="logo"?logoUrl:type==="kit"?kitUrl:stadiumPhotoUrl;const blob=await compress(file);const path="team-"+active+"/"+type+"-"+Date.now()+".jpg";const response=await fetch("https://itytyqeemfbgfcaqqyoq.supabase.co/storage/v1/object/super-league-assets/"+path,{method:"POST",headers:{"apikey":"sb_publishable_du3C3wU4-pxfmMjymhfQ2g_wycjYBF3","Content-Type":"image/jpeg"},body:blob});const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}if(!response.ok)throw new Error((data&&data.message)||("사진 업로드 실패 ("+response.status+")"));return "https://itytyqeemfbgfcaqqyoq.supabase.co/storage/v1/object/public/super-league-assets/"+path}
function preview(id,url){const el=$(id+"Preview");if(url){el.src=url;el.classList.remove("hidden")}else{el.removeAttribute("src");el.classList.add("hidden")}}
$("unlock").onclick=()=>{const i=Number($("team").value);if($("code").value.trim().toUpperCase()!==codes[i]){$("message").textContent="팀 코드가 올바르지 않습니다.";return}active=i;allowed=true;const p=rows.find(x=>Number(x.team_index)===i)||{};logoUrl=p.logo_url||"";kitUrl=p.kit_url||"";stadiumPhotoUrl=p.stadium_photo_url||"";logoFile=kitFile=stadiumPhotoFile=null;$("stadiumName").value=p.stadium_name||"";$("stadiumDescription").value=p.stadium_description||"";$("brand").value=p.kit_brand||"";$("mainSponsor").value=p.main_sponsor||"";$("sleeveSponsor").value=p.sleeve_sponsor||"";preview("logo",logoUrl);preview("kit",kitUrl);preview("stadiumPhoto",stadiumPhotoUrl);$("form").classList.remove("hidden");$("message").textContent=teams[i]+" 편집 가능"};
$("lock").onclick=()=>{allowed=false;active=-1;$("form").classList.add("hidden");$("code").value="";$("message").textContent="편집 잠금됨"};
$("logo").onchange=()=>{logoFile=$("logo").files[0]||null;if(logoFile)preview("logo",URL.createObjectURL(logoFile))};$("kit").onchange=()=>{kitFile=$("kit").files[0]||null;if(kitFile)preview("kit",URL.createObjectURL(kitFile))};$("stadiumPhoto").onchange=()=>{stadiumPhotoFile=$("stadiumPhoto").files[0]||null;if(stadiumPhotoFile)preview("stadiumPhoto",URL.createObjectURL(stadiumPhotoFile))};
$("removeLogo").onclick=()=>{logoUrl="";logoFile=null;$("logo").value="";preview("logo","")};$("removeKit").onclick=()=>{kitUrl="";kitFile=null;$("kit").value="";preview("kit","")};$("removeStadiumPhoto").onclick=()=>{stadiumPhotoUrl="";stadiumPhotoFile=null;$("stadiumPhoto").value="";preview("stadiumPhoto","")};
$("form").onsubmit=async e=>{e.preventDefault();if(!allowed||active<0)return;const btn=$("save");btn.disabled=true;$("message").textContent="저장 중…";try{const l=await upload(logoFile,"logo"),k=await upload(kitFile,"kit"),sp=await upload(stadiumPhotoFile,"stadium"),row={team_index:active,team_name:teams[active],logo_url:l||"",kit_url:k||"",stadium_name:$("stadiumName").value.trim(),stadium_description:$("stadiumDescription").value.trim(),stadium_photo_url:sp||"",kit_brand:$("brand").value.trim(),main_sponsor:$("mainSponsor").value.trim(),sleeve_sponsor:$("sleeveSponsor").value.trim(),updated_at:new Date().toISOString()};const r=await fetch(table+"?on_conflict=team_index",{method:"POST",headers:{"Content-Type":"application/json","x-team-code":codes[active]},body:JSON.stringify(row)});const raw=await r.text();let result=null;try{result=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error((result&&result.error)||("프로필 저장 실패 ("+r.status+")"));logoUrl=l;kitUrl=k;stadiumPhotoUrl=sp;logoFile=kitFile=stadiumPhotoFile=null;$("logo").value="";$("kit").value="";$("stadiumPhoto").value="";await getRows();$("message").textContent="저장 완료! 모든 이용자가 확인할 수 있습니다."}catch(err){$("message").textContent=err.message||"저장 실패"}finally{btn.disabled=false}};
$("search").oninput=render;$("team").onchange=()=>{allowed=false;active=-1;$("form").classList.add("hidden");$("code").value=""};getRows().catch(()=>$("status").textContent="불러오지 못했습니다. 새로고침해 주세요.");
</script></body></html>
