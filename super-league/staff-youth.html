<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 감독·코치·유스</title>
<style>
:root{color-scheme:dark;--line:#38332a;--muted:#94a3b8;--gold:#e5c16b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(229,193,107,.10),transparent 36%),linear-gradient(180deg,#101010,#080808 54%,#030303);background-attachment:fixed;color:#f8fafc;font-family:Inter,system-ui,sans-serif}main{max-width:980px;margin:auto;padding:26px 14px 50px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:850}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{font-size:clamp(30px,6vw,52px);margin:10px 0}p,.muted{color:var(--muted)}a{color:var(--gold);text-decoration:none;font-weight:800}.panel{background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px;margin:7px 0}label{font-size:13px;color:#d1d5db}input,select,textarea{width:100%;background:#090909;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;font:inherit;min-height:44px}button{border:0;border-radius:10px;padding:12px 15px;background:var(--gold);color:#111;font-weight:850;cursor:pointer}.danger{background:#3a1717;color:#ffd6d6;border:1px solid #6d3030}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tab{background:#181818;color:#eee;border:1px solid var(--line)}.tab.active{background:var(--gold);color:#111}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.person{border:1px solid var(--line);background:#101010;border-radius:13px;padding:13px}.person strong{display:block;font-size:16px}.person small{color:var(--muted)}.person p{font-size:13px;line-height:1.5;margin:8px 0}.person button{padding:7px 10px;font-size:12px}.status{font-size:13px;color:var(--gold);margin-top:10px}.empty{border:1px dashed var(--line);padding:20px;text-align:center;border-radius:12px;color:var(--muted)}@media(max-width:560px){main{padding:20px 10px}.panel{padding:13px}}

/* Unified SUPER LEAGUE theme */
body{background:radial-gradient(ellipse at 12% 0%,rgba(113,140,255,.18),transparent 38%),radial-gradient(ellipse at 88% 12%,rgba(185,255,74,.06),transparent 34%),linear-gradient(180deg,#17192a,#10111b 58%,#0b0c14)!important;background-attachment:fixed!important} :root{--line:#353958;--muted:#aab1cc;--gold:#718cff;--accent:#718cff} .panel,.person{background:linear-gradient(145deg,#20213a,#17192a)!important;border-color:#353958!important}input,select,textarea{background:#111322!important;border-color:#353958!important}button,.tab.active{background:#718cff!important;color:#0b0d19!important}button:hover,.tab.active:hover{background:#b9ff4a!important;color:#11150a!important}a,.eyebrow,.status{color:#b9ff4a!important}.tab,.person{border-color:#353958!important}
</style></head><body><main>
<div class="eyebrow">SUPER LEAGUE · CLUB STAFF HUB</div><header><div><h1>감독 · 코치진 · 유스</h1><p>구단별 스태프와 유스 선수단을 등록하고 함께 확인하세요.</p></div><a href="./index.html">← 메인으로</a></header>
<section class="panel"><h2>인원 등록</h2><form id="form"><div class="row"><div class="field"><label for="team">구단</label><select id="team"></select></div><div class="field"><label for="category">등록 유형</label><select id="category"><option>감독</option><option>코치진</option><option>유스</option></select></div></div><div class="row"><div class="field"><label for="name">이름 *</label><input id="name" required maxlength="100" placeholder="이름 입력"></div><div class="field"><label for="role">직책 / 포지션</label><input id="role" maxlength="100" placeholder="예: 수석 코치 / ST"></div><div class="field"><label for="age">나이</label><input id="age" type="number" min="1" max="100" placeholder="선택"></div></div><div class="field"><label for="notes">메모</label><textarea id="notes" rows="2" maxlength="500" placeholder="경력, 유스 팀, 특징 등 (선택)"></textarea></div><button type="submit">등록하기</button><div id="status" class="status"></div></form></section>
<section class="panel"><h2>등록 명단</h2><div class="row"><div class="field"><label for="filterTeam">구단 필터</label><select id="filterTeam"></select></div><div class="field"><label for="filterCategory">유형 필터</label><select id="filterCategory"><option value="">전체 유형</option><option>감독</option><option>코치진</option><option>유스</option></select></div></div><div id="list" class="list"></div></section>
<p class="muted" style="font-size:12px;line-height:1.6">등록 내용은 현재 브라우저에 저장됩니다. 등록·삭제는 서버 연결 없이 사용할 수 있으며, 다른 기기와 자동 공유되지는 않습니다.</p>
</main><script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","ASK로마사라이","진석축구단","코모쿠젠","해머스","헌라페FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","본덜랜드","Chelsea","Atletico Milan","아스날FC"];
const STORAGE_KEY="super-league-staff-youth-v1";
const $=id=>document.getElementById(id);function fill(sel,all=true){teams.forEach((n,i)=>{const o=document.createElement("option");o.value=i;o.textContent=String(i+1).padStart(2,"0")+" · "+n;$(sel).append(o)})}fill("team");fill("filterTeam");$("filterTeam").insertBefore(new Option("전체 구단",""),$("filterTeam").firstChild);
function readRecords(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(v)?v:[]}catch{return []}}
function saveRecords(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
let records=readRecords();function load(){records=readRecords();render();$("status").textContent=""}
function render(){const t=$("filterTeam").value,c=$("filterCategory").value;const rows=records.filter(x=>(t===""||String(x.team_index)===t)&&(!c||x.category===c));$("list").innerHTML="";if(!rows.length){$("list").innerHTML='<div class="empty">등록된 인원이 없습니다.</div>';return}rows.forEach(x=>{const d=document.createElement("article");d.className="person";const h=document.createElement("strong");h.textContent=x.name;const sm=document.createElement("small");sm.textContent=teams[x.team_index]+" · "+x.category+(x.role?" · "+x.role:"")+(x.age?" · "+x.age+"세":"");const p=document.createElement("p");p.textContent=x.notes||"추가 메모 없음";const b=document.createElement("button");b.className="danger";b.textContent="삭제";b.onclick=()=>{if(!confirm(x.name+" 기록을 삭제할까요?"))return;records=records.filter(r=>String(r.id)!==String(x.id));saveRecords();load();$("status").textContent="삭제 완료";};d.append(h,sm,p,b);$("list").append(d)})}
$("form").addEventListener("submit",e=>{e.preventDefault();const data={id:"staff-"+Date.now()+"-"+Math.random().toString(16).slice(2,8),team_index:Number($("team").value),category:$("category").value,name:$("name").value.trim(),role:$("role").value.trim(),age:$("age").value?Number($("age").value):null,notes:$("notes").value.trim(),created_at:new Date().toISOString()};if(!data.name){$("status").textContent="이름을 입력해 주세요.";return}records=readRecords();records.unshift(data);try{saveRecords();$("form").reset();$("status").textContent="등록 완료!";load()}catch(err){$("status").textContent="저장 실패: 브라우저 저장 공간을 확인해 주세요."}});
$("filterTeam").addEventListener("change",render);$("filterCategory").addEventListener("change",render);load();
</script></body></html>
