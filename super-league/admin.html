<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 운영자</title><style>
:root{color-scheme:dark;--line:#343958;--muted:#a7acc7;--lime:#b9ff4a;--blue:#718cff}*{box-sizing:border-box}body{margin:0;background:#10111b;color:#f5f6ff;font-family:Inter,system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px 14px 50px}h1{font-size:clamp(28px,6vw,46px)}a{color:var(--lime)}.panel{background:#191b2b;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}input{background:#0d1020;border:1px solid var(--line);border-radius:10px;padding:12px;color:white}button{background:var(--blue);border:0;border-radius:10px;padding:12px 15px;font-weight:850}p{color:var(--muted)}.status{color:var(--lime)}
</style></head><body><main><a href="./index.html">← 메인</a><h1>운영자 로그인</h1><section class="panel"><form id="form"><div class="field"><label>운영자 비밀번호</label><input id="password" type="password" required autocomplete="current-password"></div><button>로그인</button></form><p id="status" class="status"></p></section></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const j=await r.json().catch(()=>({}));document.getElementById('status').textContent=r.ok?'로그인 성공 · 관리자 작업 API가 활성화되었습니다.':j.error||'로그인 실패'}</script></body></html>
