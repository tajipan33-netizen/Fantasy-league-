<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SUPER LEAGUE | 관리자 로그인</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080808;color:#f8fafc;font-family:system-ui,sans-serif;padding:18px}.panel{width:min(100%,420px);border:1px solid #514328;border-radius:18px;padding:25px;background:linear-gradient(145deg,#171717,#0b0b0b)}.eyebrow{color:#e5c16b;font-size:11px;letter-spacing:.2em;font-weight:800}h1{font-size:28px;margin:12px 0 8px}p{color:#9ca3af;line-height:1.6;font-size:14px}label{display:block;font-size:13px;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #494133;border-radius:10px;background:#080808;color:white;font-size:16px}button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;background:#e5c16b;color:#16120a;font-weight:900;font-size:15px;cursor:pointer}.msg{min-height:22px;font-size:13px;color:#fca5a5}a{color:#e5c16b;text-decoration:none;font-size:13px}
</style></head><body><main class="panel"><div class="eyebrow">SUPER LEAGUE · ADMIN</div><h1>관리자 로그인</h1><p>관리자 인증 후에만 선수·뉴스·커뮤니티 등 데이터를 수정할 수 있습니다. 세션은 8시간 후 만료됩니다.</p>
<form id="login"><label for="password">관리자 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button id="submit" type="submit">로그인</button><div id="msg" class="msg" role="status"></div></form><a href="./index.html">← 사이트 메인으로</a></main>
<script>
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("submit"),msg=document.getElementById("msg");button.disabled=true;msg.textContent="확인 중…";try{const r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"로그인 실패");msg.style.color="#86efac";msg.textContent="로그인 성공. 관리자 페이지로 이동합니다.";location.href="./index.html?admin=1"}catch(err){msg.style.color="#fca5a5";msg.textContent=err.message}finally{button.disabled=false}});
</script></body></html>
