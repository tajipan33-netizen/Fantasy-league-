<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LEAGUE | Teams</title>
<style>
:root{color-scheme:dark;--bg:#050b14;--panel:#0c1726;--line:#1e3147;--muted:#91a3b8;--accent:#7dffc2;--accent2:#13bd87}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#142a3c 0,#07111e 38%,#050b14 76%);color:#f3f7fc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1100px;margin:auto;padding:22px 18px 60px}
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--accent);font-weight:850}
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:16px 0 22px;padding:34px 28px 32px;border:1px solid #29475b;border-radius:22px;background:linear-gradient(100deg,rgba(5,12,23,.96) 0%,rgba(7,20,34,.82) 52%,rgba(7,24,36,.48) 100%),radial-gradient(ellipse at 80% 100%,#17664f 0,transparent 34%),linear-gradient(140deg,#142a3d,#081321 70%);box-shadow:0 20px 60px #0005}
.hero:before{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(165deg,transparent 0 34px,#ffffff04 35px 36px);pointer-events:none}
.hero:after{content:"♛";position:absolute;z-index:-1;right:26px;bottom:-58px;font-size:clamp(150px,25vw,270px);line-height:1;color:#83ffd00b;text-shadow:0 0 35px #8cffc722}
h1{font-size:clamp(36px,7vw,72px);line-height:.98;margin:13px 0 12px;letter-spacing:-.065em;font-weight:950}
h1 span{color:var(--accent)}
.hero p{color:#b7c6d7;margin:0;font-size:clamp(14px,2.5vw,19px)}
.count{border:1px solid #32614f;background:#0b2822d9;border-radius:18px;padding:16px 18px;color:var(--accent);font-weight:900;white-space:nowrap;box-shadow:inset 0 1px #ffffff12}
.toolbar{display:flex;gap:10px;margin-bottom:18px;position:relative}
input{width:100%;background:#0a1422;border:1px solid #263950;border-radius:14px;padding:16px 17px;color:white;font-size:15px;outline:none;box-shadow:inset 0 1px 8px #0003}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8cffc21a}
.navgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 30px}
.navcard{display:flex;align-items:center;gap:14px;min-height:92px;padding:16px 18px;border-radius:17px;border:1px solid #263b52;background:linear-gradient(130deg,#101f31,#0a1422);color:#f5f8fc;text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
.navcard:hover{transform:translateY(-2px);border-color:#4b8b79;background:linear-gradient(130deg,#12352f,#0a1725)}
.navcard.primary{background:linear-gradient(125deg,#064d3b,#092b28);border-color:#168c68}
.navicon{display:grid;place-items:center;flex:0 0 44px;height:44px;border-radius:13px;background:#ffffff0b;color:var(--accent);font-size:24px}
.navcopy{min-width:0;flex:1}.navcopy strong{display:block;font-size:clamp(14px,2.2vw,18px);line-height:1.25}.navcopy small{display:block;color:#91a6b9;font-size:12px;margin-top:5px}.arrow{font-size:24px;color:#c4d6e4}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 4px 13px}.sectionhead h2{font-size:22px;margin:0;letter-spacing:-.03em}.sectionhead h2:before{content:"";display:inline-block;width:5px;height:23px;background:var(--accent);border-radius:8px;margin-right:11px;vertical-align:-4px}.sectionhead span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.team{display:flex;align-items:center;gap:13px;padding:13px 15px;background:linear-gradient(110deg,#0d1929,#091321);border:1px solid #1c2d42;border-radius:17px;min-height:80px;transition:border-color .15s,transform .15s}
.team:hover{border-color:#3e6b63;transform:translateY(-1px)}
.num{display:grid;place-items:center;flex:0 0 48px;height:54px;border-radius:12px;background:linear-gradient(145deg,#102d30,#0b1b28);color:var(--accent);font-weight:900;font-size:15px}
.crest{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff16;background:#14263a;color:#b9f9de;font-weight:900;font-size:11px;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.name{font-weight:780;line-height:1.35;overflow-wrap:anywhere;flex:1;font-size:15px}.teamarrow{color:#8ea3b8;font-size:22px}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid #1b2a3b;color:#63788c;font-size:11px;text-align:center;letter-spacing:.1em}
@media(max-width:620px){main{padding:18px 12px 40px}.hero{padding:27px 20px;align-items:flex-start;flex-direction:column}.count{padding:10px 13px;font-size:13px}.navgrid{gap:8px}.navcard{min-height:84px;padding:12px 10px;gap:9px}.navicon{flex-basis:34px;height:36px;font-size:19px}.navcopy small{font-size:10px}.arrow{font-size:19px}.grid{grid-template-columns:1fr}.team{min-height:76px}.sectionhead h2{font-size:20px}}
</style></head>
<body><main><div class="eyebrow">SUPER LEAGUE / OFFICIAL FANTASY FOOTBALL PLATFORM</div><div class="hero"><div><div class="eyebrow">21 CLUBS · ONE LEAGUE</div><h1>SUPER <span>LEAGUE</span></h1><p>21개의 팀이 만드는 단 하나의 리그</p></div><div class="count">21 TEAMS</div></div><div class="toolbar"><input id="search" type="search" placeholder="팀 이름을 검색하세요..." aria-label="팀 이름 검색"></div><nav class="navgrid" aria-label="주요 메뉴"><a class="navcard primary" href="./community.html"><span class="navicon">♧</span><span class="navcopy"><strong>팬 커뮤니티</strong><small>채팅 · 댓글 · 루머</small></span><span class="arrow">›</span></a><a class="navcard" href="./news.html"><span class="navicon">▤</span><span class="navcopy"><strong>공식 뉴스 및 공지</strong><small>리그 소식 · 경기 일정</small></span><span class="arrow">›</span></a><a class="navcard" href="./standings.html"><span class="navicon">🏆</span><span class="navcopy"><strong>리그 순위 보기</strong><small>최신 순위 · 기록</small></span><span class="arrow">›</span></a><a class="navcard" href="./players.html"><span class="navicon">♟</span><span class="navcopy"><strong>팀별 선수 등록 센터</strong><small>선수단 관리</small></span><span class="arrow">›</span></a><a class="navcard" href="./team-profile.html"><span class="navicon">◈</span><span class="navcopy"><strong>유니폼 · 엠블럼 등록</strong><small>팀 프로필 · 스폰서</small></span><span class="arrow">›</span></a></nav><div class="sectionhead"><h2>참가 팀 명단</h2><span>총 21팀</span></div><section class="grid" id="teams" aria-live="polite"></section><div class="foot">SUPER LEAGUE · OFFICIAL FANTASY FOOTBALL PLATFORM</div></main>
<script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","ASK로마사라이","진석축구단","코모쿠젠","해머스","헌라페FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","FC DÉLPIO(존잘)","Chelsea","Atletico Milan","아스날FC"];
const grid=document.getElementById('teams'),search=document.getElementById('search');
function render(){const q=search.value.trim().toLocaleLowerCase();const filtered=teams.map((name,i)=>({name,num:i+1})).filter(t=>t.name.toLocaleLowerCase().includes(q));grid.innerHTML='';for(const t of filtered){const card=document.createElement('article');card.className='team';const n=document.createElement('span');n.className='num';n.textContent=String(t.num).padStart(2,'0');const crest=document.createElement('span');crest.className='crest';crest.textContent=t.name.replace(/[^A-Za-z가-힣]/g,'').slice(0,3).toUpperCase()||'FC';const name=document.createElement('span');name.className='name';name.textContent=t.name;const arrow=document.createElement('span');arrow.className='teamarrow';arrow.textContent='›';card.append(n,crest,name,arrow);grid.append(card)}if(!filtered.length){const empty=document.createElement('p');empty.className='foot';empty.textContent='검색 결과가 없습니다.';grid.append(empty)}}
search.addEventListener('input',render);render();
</script></body></html>
