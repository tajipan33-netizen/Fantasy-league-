<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER LEAGUE | Teams</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2c;--line:#26334a;--muted:#94a3b8;--accent:#8cffc7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15263d 0,#080d18 55%);color:#f8fafc;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:980px;margin:auto;padding:32px 18px 60px}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:800}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:10px 0 28px;flex-wrap:wrap}h1{font-size:clamp(34px,7vw,62px);line-height:1;margin:10px 0 8px;letter-spacing:-.05em}p{color:var(--muted);margin:0}.count{border:1px solid #365246;background:#11251f;border-radius:14px;padding:12px 16px;color:var(--accent);font-weight:800;white-space:nowrap}.toolbar{display:flex;gap:10px;margin-bottom:18px}input{width:100%;background:#0d1524;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:white;font-size:15px;outline:none}input:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.team{display:flex;align-items:center;gap:13px;padding:16px;background:linear-gradient(145deg,#121d30,#0e1625);border:1px solid var(--line);border-radius:15px;min-height:76px}.num{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:11px;background:#1e2b40;color:var(--accent);font-weight:800;font-size:12px}.name{font-weight:700;line-height:1.35;overflow-wrap:anywhere}.foot{margin-top:24px;color:#718096;font-size:12px;text-align:center}
</style></head>
<body><main><div class="eyebrow">OFFICIAL FANTASY FOOTBALL PLATFORM</div><div class="hero"><div><h1>SUPER LEAGUE</h1><p>참가 팀 명단</p></div><div class="count">21 TEAMS</div></div><div class="toolbar"><input id="search" type="search" placeholder="팀 이름 검색..." aria-label="팀 이름 검색"></div><p style="margin:0 0 18px"><a href="./players.html" style="display:inline-block;padding:12px 16px;border-radius:11px;background:#8cffc7;color:#07120e;text-decoration:none;font-weight:800">팀별 선수 등록 센터 →</a></p><section class="grid" id="teams" aria-live="polite"></section><div class="foot">SUPER LEAGUE · 팀 명단 v1.0</div></main>
<script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","영국 어느시의 푸른 도시(진)","진석축구단","코모쿠젠","해머스","헌럽 FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","FC DÉLPIO(존잘)","Chelsea","Atletico Milan","아스날FC"];
const grid=document.getElementById('teams'),search=document.getElementById('search');
function render(){const q=search.value.trim().toLocaleLowerCase();const filtered=teams.map((name,i)=>({name,num:i+1})).filter(t=>t.name.toLocaleLowerCase().includes(q));grid.innerHTML='';for(const t of filtered){const card=document.createElement('article');card.className='team';const n=document.createElement('span');n.className='num';n.textContent=String(t.num).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=t.name;card.append(n,name);grid.append(card)}if(!filtered.length){const empty=document.createElement('p');empty.textContent='검색 결과가 없습니다.';grid.append(empty)}}
search.addEventListener('input',render);render();
</script></body></html>
