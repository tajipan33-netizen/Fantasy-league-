<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 경기</title><style>
:root{color-scheme:dark;--line:#343958;--muted:#a7acc7;--lime:#b9ff4a;--blue:#718cff}*{box-sizing:border-box}body{margin:0;background:#10111b;color:#f5f6ff;font-family:Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px 14px 50px}h1{font-size:clamp(28px,6vw,48px);margin:10px 0}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:var(--lime);text-decoration:none}.muted{color:var(--muted)}.panel{background:#191b2b;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:6px;margin:5px 0}label{font-size:13px;color:#d8dcf0}input,select,textarea{background:#0d1020;border:1px solid var(--line);border-radius:10px;padding:11px;color:white;width:100%;min-height:42px}button{background:var(--blue);color:#0b0d19;border:0;border-radius:10px;padding:11px 14px;font-weight:850;cursor:pointer}.match{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--line)}.score{font-size:25px;font-weight:950;color:var(--lime)}.center{text-align:center}.team{text-align:center;font-weight:850}.small{color:var(--muted);font-size:12px}.status{color:var(--lime);font-size:13px}@media(max-width:560px){main{padding:14px 10px}.formgrid{grid-template-columns:1fr}.match{gap:5px}.team{font-size:13px}}
</style></head><body><main><div class="top"><div><div style="color:var(--lime);letter-spacing:.2em;font-size:11px;font-weight:900">FIXTURES & RESULTS</div><h1>경기 일정 · 결과</h1><p class="muted">경기 등록 및 스코어 관리</p></div><a href="./index.html">← 메인</a></div>
<section class="panel"><h2>경기 등록 / 결과 입력</h2><form id="form"><div class="formgrid"><div class="field"><label>라운드</label><input id="round" type="number" min="1" max="100" required></div><div class="field"><label>경기 날짜</label><input id="date" type="date"></div><div class="field"><label>홈팀</label><select id="home"></select></div><div class="field"><label>원정팀</label><select id="away"></select></div><div class="field"><label>홈 득점</label><input id="hs" type="number" min="0" max="99"></div><div class="field"><label>원정 득점</label><input id="as" type="number" min="0" max="99"></div><div class="field"><label>경기장</label><input id="venue" maxlength="120"></div><div class="field"><label>경기 MVP</label><input id="mom" maxlength="100"></div></div><div class="field"><label>경기 보고서 / 주요 기록</label><textarea id="report" rows="3"></textarea></div><button>경기 저장</button><span class="status" id="status"></span></form></section>
<section class="panel"><div class="row"><h2>전체 경기</h2><button id="refresh">새로고침</button></div><div id="list"></div></section></main><script>
const $=id=>document.getElementById(id);let clubs=[];
async function req(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','x-admin-mode':'1',...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function loadClubs(){const j=await req('/api/clubs');clubs=j.clubs||[];['home','away'].forEach(id=>$(id).replaceChildren(...clubs.map(c=>new Option(c.name,c.id))));}
async function load(){const j=await req('/api/matches');$('list').replaceChildren();(j.matches||[]).forEach(m=>{const d=document.createElement('div');d.className='match';const h=document.createElement('div');h.className='team';h.textContent=m.home_team;const c=document.createElement('div');c.className='center';const sc=document.createElement('div');sc.className='score';sc.textContent=m.home_score==null?'vs':m.home_score+' : '+m.away_score;const sm=document.createElement('div');sm.className='small';sm.textContent=(m.round_number?m.round_number+'R · ':'')+(m.match_date||'일정 미정')+(m.mom?' · MOM '+m.mom:'');c.append(sc,sm);const a=document.createElement('div');a.className='team';a.textContent=m.away_team;d.append(h,c,a);$('list').append(d)})}
$('form').onsubmit=async e=>{e.preventDefault();try{await req('/api/matches',{method:'POST',body:JSON.stringify({round_number:Number($('round').value),match_date:$('date').value||null,home_club_id:$('home').value,away_club_id:$('away').value,home_score:$('hs').value===''?null:Number($('hs').value),away_score:$('as').value===''?null:Number($('as').value),venue:$('venue').value,mom:$('mom').value,match_report:$('report').value})});$('status').textContent='저장 완료';await load()}catch(err){$('status').textContent=err.message}};$('refresh').onclick=()=>load().catch(e=>alert(e.message));loadClubs().then(load).catch(e=>$('status').textContent=e.message);
</script></body></html>
