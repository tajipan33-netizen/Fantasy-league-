<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 선수단</title><style>
:root{color-scheme:dark;--line:#343958;--muted:#a7acc7;--lime:#b9ff4a;--blue:#718cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#718cff25,transparent 36%),#10111b;color:#f5f6ff;font-family:Inter,system-ui,sans-serif}main{max-width:980px;margin:auto;padding:22px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(28px,6vw,48px);margin:10px 0}p,.muted{color:var(--muted)}a{color:var(--lime);text-decoration:none}.panel{background:#191b2b;border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:180px;margin:6px 0}label{font-size:13px;color:#d8dcf0}input,select{background:#0d1020;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;width:100%;min-height:43px}button{background:var(--blue);color:#090d1a;border:0;border-radius:10px;padding:12px 15px;font-weight:850;cursor:pointer}button.secondary{background:#252844;color:#e6e9ff;border:1px solid #41476c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.player{border:1px solid var(--line);background:#141729;border-radius:13px;padding:13px;display:flex;gap:11px;align-items:center}.avatar{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#252844}.player strong{display:block}.player small{color:var(--muted)}.hidden{display:none!important}.status{font-size:13px;color:var(--lime);min-height:18px}@media(max-width:550px){main{padding:14px 10px}.panel{padding:13px}}
</style></head><body><main><div class="top"><div><div style="color:var(--lime);letter-spacing:.2em;font-size:11px;font-weight:900">SQUAD HUB</div><h1>선수단 관리</h1><p>구단별 선수 명단을 등록하고 공개합니다.</p></div><a href="./index.html">← 메인</a></div>
<section class="panel"><div class="row"><div class="field"><label for="club">구단 선택</label><select id="club"></select></div><div class="field"><label for="teamCode">팀 코드</label><input id="teamCode" type="password" autocomplete="off" placeholder="등록·수정 시 입력"></div></div><p class="status" id="status">구단 목록 불러오는 중…</p><div id="players" class="grid"></div></section>
<section id="editor" class="panel hidden"><h2 id="formTitle">선수 등록</h2><form id="form"><div class="row"><div class="field"><label>이름 *</label><input id="name" maxlength="100" required></div><div class="field"><label>등번호</label><input id="number" type="number" min="0" max="99"></div><div class="field"><label>포지션</label><select id="position"><option>GK</option><option>CB</option><option>LB</option><option>RB</option><option>RWB</option><option>LWB</option><option>CDM</option><option>CM</option><option>CAM</option><option>LW</option><option>RW</option><option>CF</option><option>ST</option></select></div><div class="field"><label>OVR (1–99)</label><input id="ovr" type="number" min="1" max="99" value="70"></div></div><div class="row"><div class="field"><label>국적</label><input id="nationality" maxlength="80"></div><div class="field"><label>사진 URL</label><input id="photo" type="url" placeholder="https://..."></div></div><div class="field"><label>메모</label><input id="notes" maxlength="200"></div><div class="row"><button id="save">선수 저장</button><button type="button" class="secondary" id="cancel">취소</button></div></form></section>
</main><script>
const $=id=>document.getElementById(id);let clubs=[],players=[],editing=null;
async function api(url,opts){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','x-team-code':$('teamCode').value.trim(),...(opts&&opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청에 실패했습니다.');return j}
async function init(){const j=await api('/api/leagues/clubs');clubs=j.clubs||[];$('club').replaceChildren(...clubs.map(c=>new Option(c.name,c.id)));await load()}
async function load(){const c=clubs.find(x=>x.id===$('club').value);if(!c)return;const j=await api('/api/leagues/roster?club_id='+encodeURIComponent(c.id));players=j.players||[];$('players').replaceChildren();$('status').textContent=players.length+'명 등록 · '+c.name;players.forEach(p=>{const d=document.createElement('article');d.className='player';const img=document.createElement('img');img.className='avatar';img.src=p.photo_url||'';img.alt='';const txt=document.createElement('div');const strong=document.createElement('strong');strong.textContent=(p.shirt_number?'#'+p.shirt_number+' ':'')+p.name;const small=document.createElement('small');small.textContent=p.position+' · OVR '+p.ovr+(p.nationality?' · '+p.nationality:'');txt.append(strong,small);d.append(img,txt);const edit=document.createElement('button');edit.className='secondary';edit.textContent='수정';edit.onclick=()=>showEdit(p);d.append(edit);const del=document.createElement('button');del.className='secondary';del.textContent='삭제';del.onclick=()=>remove(p.id);d.append(del);$('players').append(d)});$('editor').classList.remove('hidden')}
function showEdit(p){editing=p||null;$('formTitle').textContent=p?'선수 수정':'선수 등록';$('name').value=p?.name||'';$('number').value=p?.shirt_number??'';$('position').value=p?.position||'GK';$('ovr').value=p?.ovr??70;$('nationality').value=p?.nationality||'';$('photo').value=p?.photo_url||'';$('notes').value=p?.notes||'';$('editor').classList.remove('hidden')}
async function remove(id){if(!confirm('선수를 삭제할까요?'))return;try{await api('/api/leagues/roster?id='+encodeURIComponent(id),{method:'DELETE'});await load()}catch(e){alert(e.message)}}
$('club').onchange=()=>load().catch(e=>$('status').textContent=e.message);$('form').onsubmit=async e=>{e.preventDefault();const body={club_id:$('club').value,name:$('name').value.trim(),shirt_number:$('number').value?Number($('number').value):null,position:$('position').value,ovr:Number($('ovr').value),nationality:$('nationality').value.trim(),photo_url:$('photo').value.trim(),notes:$('notes').value.trim()};try{await api('/api/leagues/roster'+(editing?'?id='+encodeURIComponent(editing.id):''),{method:editing?'PATCH':'POST',body:JSON.stringify(body)});editing=null;$('form').reset();$('ovr').value='70';await load()}catch(err){$('status').textContent=err.message}};$('cancel').onclick=()=>{editing=null;$('form').reset()};init().catch(e=>$('status').textContent=e.message);
</script></body></html>
