<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 시즌 기록</title>
<style>
:root{color-scheme:dark;--line:#38332a;--muted:#94a3b8;--gold:#e5c16b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,rgba(229,193,107,.10),transparent 36%),linear-gradient(180deg,#101010,#080808 54%,#030303);background-attachment:fixed;color:#f8fafc;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:26px 14px 50px}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:850}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{font-size:clamp(30px,6vw,52px);margin:10px 0}h2{font-size:20px}p,.muted{color:var(--muted)}a{color:var(--gold);text-decoration:none;font-weight:800}.panel{background:linear-gradient(145deg,#171717,#0b0b0b);border:1px solid var(--line);border-radius:16px;padding:17px;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px;margin:7px 0}label{font-size:13px;color:#d1d5db}input,select{width:100%;background:#090909;border:1px solid var(--line);border-radius:10px;padding:12px;color:white;font:inherit;min-height:44px}button{border:0;border-radius:10px;padding:12px 15px;background:var(--gold);color:#111;font-weight:850;cursor:pointer}.danger{background:#3a1717;color:#ffd6d6;border:1px solid #6d3030}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{background:#181818;color:#eee;border:1px solid var(--line)}.tab.active{background:var(--gold);color:#111}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:650px;font-size:14px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #292929}th{color:var(--gold);background:#151515;font-size:12px}tr:last-child td{border-bottom:0}.empty{padding:20px;text-align:center;color:var(--muted)}.status{font-size:13px;color:var(--gold);margin-top:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.statcard{background:#111;border:1px solid var(--line);border-radius:13px;padding:14px}.statcard strong{font-size:27px;color:var(--gold);display:block}.statcard small{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}@media(max-width:560px){main{padding:20px 10px}.panel{padding:13px}}
</style></head><body><main>
<div class="eyebrow">SUPER LEAGUE · OFFICIAL STATISTICS</div><header><div><h1>시즌 기록 센터</h1><p>득점 · 도움 · 선방 · 라운드별 MOM을 한곳에서 관리하고 확인하세요.</p></div><a href="./index.html">← 메인으로</a></header>
<section class="panel"><h2>경기 기록 등록</h2><form id="form"><div class="row"><div class="field"><label for="round">라운드 *</label><input id="round" type="number" min="1" max="100" required placeholder="예: 1"></div><div class="field"><label for="match">경기명</label><input id="match" maxlength="140" placeholder="예: 셀틱FC vs 본덜랜드"></div></div><div class="row"><div class="field"><label for="team">선수 소속 구단 *</label><select id="team"></select></div><div class="field"><label for="player">선수 이름 *</label><input id="player" required maxlength="100" placeholder="선수 이름"></div></div><div class="row"><div class="field"><label for="goals">득점</label><input id="goals" type="number" min="0" max="99" value="0" required></div><div class="field"><label for="assists">어시스트</label><input id="assists" type="number" min="0" max="99" value="0" required></div><div class="field"><label for="saves">선방 (골키퍼)</label><input id="saves" type="number" min="0" max="999" value="0" required></div></div><label style="display:flex;gap:9px;align-items:center;margin:12px 0"><input id="mom" type="checkbox" style="width:18px;min-height:18px"> 이 선수를 해당 라운드 경기 MOM으로 지정</label><button type="submit">경기 기록 저장</button><div id="status" class="status"></div></form></section>
<section class="panel"><h2>시즌 누적 기록</h2><div class="cards" id="summary"></div><div class="tabs"><button class="tab active" data-tab="goals">득점 순위</button><button class="tab" data-tab="assists">어시스트 순위</button><button class="tab" data-tab="saves">선방 순위</button><button class="tab" data-tab="mom">라운드 MOM</button></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
<section class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">전체 경기 기록</h2><button id="refresh" type="button">새로고침</button></div><div class="tablewrap"><table><thead><tr><th>라운드</th><th>경기</th><th>구단</th><th>선수</th><th>득점</th><th>어시</th><th>선방</th><th>MOM</th><th>관리</th></tr></thead><tbody id="allRows"></tbody></table></div></section>
<p class="muted" style="font-size:12px;line-height:1.6">모든 기록은 공용 데이터베이스에 저장됩니다. 라운드 MOM은 경기별로 등록하세요. 여러 경기의 MOM을 기록하면 해당 라운드의 경기별 MOM을 모두 볼 수 있습니다.</p>
</main><script>
const teams=["셀틱FC","FC BARCELONA","노팅엄 실험실","마레스카나치오날레(인테르+뉴캐슬)","알 빌라 AL VILLA","알네르바체","ASK로마사라이","진석축구단","코모쿠젠","해머스","헌라페FC","xmc_1894","SKY CITY","Royal York Madrid","MSG","Les Bleus","FC Der Klassiker","본덜랜드","Chelsea","Atletico Milan","아스날FC","NAPLESEA FC"];
const URL="/api/store?collection=match-stats";const $=id=>document.getElementById(id);
teams.forEach((n,i)=>{const o=new Option(String(i+1).padStart(2,"0")+" · "+n,i);$("team").append(o)});
async function api(path="",opts={}){const r=await fetch(URL+path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const raw=await r.text();let data=[];try{data=raw?JSON.parse(raw):[]}catch{}if(!r.ok){if(r.status===401){location.href="/admin-login.html";throw Error("관리자 로그인이 필요합니다.")}throw Error((data&&data.error)||("요청 실패 ("+r.status+")"))}return data}
let records=[],tab="goals";const num=v=>Number(v)||0;function td(tr,v){const d=document.createElement("td");d.textContent=v;tr.append(d)}
async function load(){try{records=await api("?select=*&order=round_number.asc,created_at.asc");render();$("status").textContent=""}catch(e){$("status").textContent="기록을 불러오지 못했습니다. Vercel 저장소 설정을 확인해 주세요.";$("tbody").innerHTML='<tr><td colspan="4">데이터를 불러오지 못했습니다.</td></tr>'}}
function render(){const totals={};records.forEach(r=>{const k=r.player_name+"|||"+r.team_index;if(!totals[k])totals[k]={name:r.player_name,team:r.team_index,goals:0,assists:0,saves:0,mom:0};totals[k].goals+=num(r.goals);totals[k].assists+=num(r.assists);totals[k].saves+=num(r.saves);if(r.is_mom)totals[k].mom++});
$("summary").innerHTML="";[["득점",records.reduce((a,r)=>a+num(r.goals),0)],["어시스트",records.reduce((a,r)=>a+num(r.assists),0)],["선방",records.reduce((a,r)=>a+num(r.saves),0)],["MOM",records.filter(r=>r.is_mom).length]].forEach(([label,val])=>{const d=document.createElement("div");d.className="statcard";const s=document.createElement("strong");s.textContent=val;const sm=document.createElement("small");sm.textContent=label;d.append(s,sm);$("summary").append(d)});
$("thead").innerHTML="";$("tbody").innerHTML="";if(tab==="mom"){const tr=document.createElement("tr");["라운드","경기","구단","MOM 선수"].forEach(x=>{const th=document.createElement("th");th.textContent=x;tr.append(th)});$("thead").append(tr);const rows=records.filter(r=>r.is_mom).sort((a,b)=>a.round_number-b.round_number);rows.forEach(r=>{const tr=document.createElement("tr");[r.round_number+"R",r.match_label||"—",teams[r.team_index]||"—",r.player_name].forEach(x=>td(tr,x));$("tbody").append(tr)});if(!rows.length)$("tbody").innerHTML='<tr><td colspan="4" class="empty">아직 MOM 기록이 없습니다.</td></tr>'}
else{const label={goals:"득점",assists:"어시스트",saves:"선방"}[tab];const tr=document.createElement("tr");["순위","선수","구단",label].forEach(x=>{const th=document.createElement("th");th.textContent=x;tr.append(th)});$("thead").append(tr);const rows=Object.values(totals).sort((a,b)=>b[tab]-a[tab]||a.name.localeCompare(b.name)).filter(x=>x[tab]>0);rows.forEach((r,i)=>{const tr=document.createElement("tr");[i+1,r.name,teams[r.team]||"—",r[tab]].forEach(x=>td(tr,x));$("tbody").append(tr)});if(!rows.length)$("tbody").innerHTML='<tr><td colspan="4" class="empty">아직 기록이 없습니다.</td></tr>'}
$("allRows").innerHTML="";[...records].sort((a,b)=>b.round_number-a.round_number||b.id-a.id).forEach(r=>{const tr=document.createElement("tr");[r.round_number+"R",r.match_label||"—",teams[r.team_index]||"—",r.player_name,r.goals,r.assists,r.saves,r.is_mom?"★":"—"].forEach(x=>td(tr,x));const d=document.createElement("td"),b=document.createElement("button");b.className="danger";b.textContent="삭제";b.onclick=async()=>{if(!confirm(r.player_name+"의 경기 기록을 삭제할까요?"))return;try{await api("?id=eq."+r.id,{method:"DELETE"});await load()}catch(e){alert("삭제에 실패했습니다.")}};d.append(b);tr.append(d);$("allRows").append(tr)});if(!records.length)$("allRows").innerHTML='<tr><td colspan="9" class="empty">아직 경기 기록이 없습니다.</td></tr>'}
$("form").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const data={round_number:Number($("round").value),match_label:$("match").value.trim(),team_index:Number($("team").value),player_name:$("player").value.trim(),goals:Number($("goals").value),assists:Number($("assists").value),saves:Number($("saves").value),is_mom:$("mom").checked};await api("",{method:"POST",body:JSON.stringify(data)});$("player").value="";$("goals").value="0";$("assists").value="0";$("saves").value="0";$("mom").checked=false;$("status").textContent="저장 완료!";await load()}catch(err){$("status").textContent="저장에 실패했습니다. Vercel 저장소 설정을 확인해 주세요."}finally{b.disabled=false}});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));render()}));$("refresh").addEventListener("click",load);load();
</script></body></html>
