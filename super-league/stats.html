<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER LEAGUE | 시즌 기록</title><style>
:root{color-scheme:dark;--line:#343958;--muted:#a7acc7;--lime:#b9ff4a;--blue:#718cff}*{box-sizing:border-box}body{margin:0;background:#10111b;color:#f5f6ff;font-family:Inter,system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px 12px 50px}h1{font-size:clamp(28px,6vw,48px);margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}a{color:var(--lime);text-decoration:none}.panel{background:#191b2b;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:15px}.row{display:flex;gap:9px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;margin:6px 0}label{font-size:13px;color:#d8dcf0}input,select{background:#0d1020;border:1px solid var(--line);border-radius:10px;padding:11px;color:white;width:100%}button{background:var(--blue);border:0;border-radius:10px;padding:11px 14px;font-weight:850;color:#090d1a}.muted{color:var(--muted);font-size:12px}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:500px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--lime)}.rank{color:var(--lime);font-weight:900}
</style></head><body><main><div class="top"><div><div style="color:var(--lime);font-size:11px;letter-spacing:.2em">SEASON STATISTICS</div><h1>선수 시즌 기록</h1><p class="muted">득점 · 어시스트 · 선방 누적</p></div><a href="./index.html">← 메인</a></div><section class="panel"><div class="row"><div class="field"><label>기록 유형</label><select id="kind"><option value="goals">득점</option><option value="assists">어시스트</option><option value="saves">선방</option></select></div></div><div class="table"><table><thead><tr><th>순위</th><th>선수</th><th>구단</th><th>기록</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let data=[];async function load(){const r=await fetch('/api/stats');const j=await r.json();if(!r.ok)throw Error(j.error||'기록 조회 실패');data=j.stats;render()}function render(){const k=document.getElementById('kind').value;const b=document.getElementById('rows');b.replaceChildren();data.slice().sort((a,b)=>b[k]-a[k]).filter(x=>x[k]>0).forEach((x,i)=>{const tr=document.createElement('tr');[i+1,x.name,x.club_name,x[k]].forEach((v,j)=>{const td=document.createElement('td');td.textContent=v;if(j===0)td.className='rank';tr.append(td)});b.append(tr)})}document.getElementById('kind').onchange=render;load().catch(e=>document.getElementById('rows').textContent=e.message);
</script></body></html>
