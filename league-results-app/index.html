<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101018"><title>SUPER LEAGUE</title><style>
:root{color-scheme:dark;--bg:#0d0d12;--panel:#17171f;--line:#2b2b37;--muted:#9999aa;--gold:#d7b45a;--purple:#8d71d6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#211b32 0,#0d0d12 42%);color:#f7f6fb;font-family:Inter,system-ui,-apple-system,sans-serif}header{max-width:1040px;margin:auto;padding:32px 20px 18px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.28em;font-weight:800}h1{font-size:clamp(30px,6vw,48px);margin:8px 0 4px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px}.wrap{max-width:1040px;margin:auto;padding:0 20px 50px}.tabs{display:flex;gap:8px;margin:18px 0 20px;overflow:auto}.tab{border:1px solid var(--line);background:#17171f;color:#bdbbc9;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}.tab.active{background:var(--gold);color:#17130a;border-color:var(--gold)}.panel{background:linear-gradient(145deg,#1a1a24,#14141b);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 12px 36px #0003}.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px;gap:10px}.section-head h2{font-size:18px;margin:0}.hint{color:var(--muted);font-size:12px}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line)}.match:last-child{border:0}.team{font-weight:750}.right{text-align:right}.score{font-size:22px;font-weight:900;letter-spacing:.1em;white-space:nowrap}.meta{color:var(--muted);font-size:11px;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:36px 10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:center;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:700;font-size:11px}td:first-child,th:first-child{text-align:left}td.club{font-weight:750}.rank{color:var(--gold);font-weight:900}.top{color:var(--gold)}footer{text-align:center;padding:25px;color:#777587;font-size:11px;letter-spacing:.12em}.hidden{display:none}@media(max-width:520px){header{padding-top:24px}.panel{padding:14px}.match{gap:7px}.team{font-size:13px}.score{font-size:19px}.tab{padding:11px 14px}}
</style></head><body><header><div class="eyebrow">SPFL · OFFICIAL LEAGUE CENTER</div><h1>SUPER LEAGUE</h1><div class="sub">경기 결과 · 리그 순위 · 득점 순위</div></header><main class="wrap"><nav class="tabs" aria-label="리그 메뉴"><button class="tab active" data-tab="results">경기 결과</button><button class="tab" data-tab="table">리그 순위</button><button class="tab" data-tab="scorers">득점 순위</button></nav>
<section id="results"><div class="panel"><div class="section-head"><h2>최근 경기</h2><span class="hint">MATCH RESULTS</span></div><div id="matches"></div></div></section>
<section id="table" class="hidden"><div class="panel"><div class="section-head"><h2>리그 테이블</h2><span class="hint">LEAGUE TABLE</span></div><div class="table-wrap"><table><thead><tr><th>순위 / 팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody id="standings"></tbody></table></div></div></section>
<section id="scorers" class="hidden"><div class="panel"><div class="section-head"><h2>득점 순위</h2><span class="hint">TOP SCORERS</span></div><div class="table-wrap"><table><thead><tr><th>순위 / 선수</th><th>소속팀</th><th>득점</th></tr></thead><tbody id="scorerRows"></tbody></table></div></div></section></main><footer>SUPER LEAGUE · SPFL</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script>
const SUPABASE_URL='https://fdszmpirncjkznjciikz.supabase.co';
const SUPABASE_KEY='sb_publishable_QAEojvwsfeDz_xcZn831ug_zaEHy9di';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const data={matches:[],teams:[],scorers:[]};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showMessage(selector,message){document.querySelector(selector).innerHTML='<div class="empty">'+esc(message)+'</div>'}
function render(){
 document.querySelector('#matches').innerHTML=data.matches.length?data.matches.map(m=>`<article class="match"><div><div class="team">${esc(m.home?.name)}</div><div class="meta">${esc(m.match_date||'')}${m.venue?' · '+esc(m.venue):''}</div></div><div class="score">${Number(m.home_score)} : ${Number(m.away_score)}</div><div class="right"><div class="team">${esc(m.away?.name)}</div><div class="meta">${esc(m.round_label||'')}</div></div></article>`).join(''):'<div class="empty">등록된 경기 결과가 없습니다.</div>';
 const stats=new Map(data.teams.map(t=>[t.id,{...t,played:0,w:0,d:0,l:0,gf:0,ga:0,points:0}]));
 data.matches.forEach(m=>{const h=stats.get(m.home_club_id),a=stats.get(m.away_club_id);if(!h||!a||m.home_score===null||m.away_score===null)return;const hs=Number(m.home_score),as=Number(m.away_score);h.played++;a.played++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;if(hs>as){h.w++;h.points+=3;a.l++}else if(hs<as){a.w++;a.points+=3;h.l++}else{h.d++;a.d++;h.points++;a.points++}});
 const sorted=[...stats.values()].map(t=>({...t,gd:t.gf-t.ga})).sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||a.sort_order-b.sort_order);
 document.querySelector('#standings').innerHTML=sorted.map((t,i)=>`<tr><td class="club"><span class="rank">${i+1}</span>　${esc(t.name)}</td><td>${t.played}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gd>0?'+':''}${t.gd}</td><td class="top"><b>${t.points}</b></td></tr>`).join('');
 document.querySelector('#scorerRows').innerHTML=data.scorers.length?data.scorers.map((p,i)=>`<tr><td class="club"><span class="rank">${i+1}</span>　${esc(p.player_name)}</td><td>${esc(p.club_name)}</td><td class="top"><b>${p.goals}</b></td></tr>`).join(''):'<tr><td colspan="3" class="empty">등록된 득점 기록이 없습니다.</td></tr>';
}
async function loadLeague(){
 showMessage('#matches','Supabase에서 경기 정보를 불러오는 중입니다.');
 try{
  const [clubRes,matchRes]=await Promise.all([
   db.from('spfl_clubs').select('id,name,sort_order').order('sort_order'),
   db.from('spfl_matches').select('id,match_date,round_label,home_club_id,away_club_id,home_score,away_score,venue,status,home:spfl_clubs!spfl_matches_home_club_id_fkey(name),away:spfl_clubs!spfl_matches_away_club_id_fkey(name)').eq('status','finished').order('match_date',{ascending:false})
  ]);
  if(clubRes.error)throw clubRes.error;if(matchRes.error)throw matchRes.error;
  data.teams=clubRes.data||[];data.matches=matchRes.data||[];
  const ids=data.matches.map(m=>m.id);
  if(ids.length){
   const statRes=await db.from('spfl_match_player_stats').select('match_id,club_id,player_name,goals,assists').in('match_id',ids);
   if(statRes.error)throw statRes.error;
   const clubNames=new Map(data.teams.map(c=>[c.id,c.name]));
   const aggregate=new Map();
   (statRes.data||[]).forEach(s=>{const key=s.club_id+'|'+s.player_name;const item=aggregate.get(key)||{player_name:s.player_name,club_name:clubNames.get(s.club_id)||'',goals:0,assists:0};item.goals+=Number(s.goals||0);item.assists+=Number(s.assists||0);aggregate.set(key,item)});
   data.scorers=[...aggregate.values()].filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);
  }
  render();
 }catch(error){
  console.error(error);
  showMessage('#matches','데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
  showMessage('#standings','순위 정보를 불러오지 못했습니다.');
  showMessage('#scorerRows','득점 정보를 불러오지 못했습니다.');
 }
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['results','table','scorers'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab))}));
loadLeague();
</script>
</script></body></html>
